services:
  ubt:
    build:
      context: .
      dockerfile: Dockerfile
    image: universal-book-translator:latest
    container_name: ubt-app
    restart: unless-stopped
    ports:
      - "${UBT_PORT:-8000}:8000"
    environment:
      # --- Outbound LLM Provider Configuration (UBT Single-Key Design) ---
      # UBT uses a unified UBT_LLM_API_KEY for all providers (third-party names like
      # OPENAI_API_KEY are deliberately not read).
      # - UBT_PROVIDER=openai-chat           # Built-in protocols: openai-chat, anthropic-messages, gemini-native
      # - UBT_LLM_API_KEY=sk-...             # Your outbound model API key
      # - UBT_DRAFT_MODEL=gpt-4o-mini        # Draft translation model
      # - UBT_REPAIR_MODEL=gpt-4o            # Repair/Refinement model (optional)
      # - UBT_BASE_URL=https://api.openai.com/v1 # Custom endpoint/relay (optional)
      # --- Network & Storage Binding ---
      - UBT_HOST=0.0.0.0
      - UBT_PORT=8000
      - UBT_ALLOWED_DIRS=/data
      - UBT_DB_DIR=/data/dbs
      - UBT_OUTPUT_DIR=/data/output
      - UBT_ALLOW_NO_AUTH=${UBT_ALLOW_NO_AUTH:-1}
      - UBT_ALLOW_INSECURE_BIND=${UBT_ALLOW_INSECURE_BIND:-1}
      # Set UBT_API_KEY to require authentication on public networks:
      # - UBT_API_KEY=your-secure-token
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional dedicated OCR sidecar service for heavy in-process image OCR
  ubt-ocr-sidecar:
    profiles: ["ocr"]
    build:
      context: ./deploy/docker/ocr-sidecar
      dockerfile: Dockerfile
    image: ubt-ocr-sidecar:latest
    container_name: ubt-ocr-sidecar
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - UBT_OCR_SIDECAR_TOKEN=${UBT_OCR_SIDECAR_TOKEN:-local-dev-token}
