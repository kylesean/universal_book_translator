# =============================================================================
# UBT Sample Book Translation Configuration
#
# Copy this file to `ubt.toml` in your working directory (auto-discovered, and
# git-ignored so your key stays local), set DEEPSEEK_API_KEY, then run:
#
#   cp examples/sample_book/ubt_sample_config.toml ubt.toml
#   export DEEPSEEK_API_KEY="sk-..."
#   ubt translate examples/sample_book/deep_learning_primer.md -l zh
#
# The document schema is exactly two kinds of section: [providers.<name>]
# blocks and [defaults]. Unknown tables are rejected loudly, not ignored —
# see ubt.toml.example for the full field reference.
# =============================================================================

[providers.deepseek]
base_url = "https://api.deepseek.com/v1"
api_mode = "openai-chat"
api_key = "${DEEPSEEK_API_KEY}"
draft_model = "deepseek-chat"
repair_model = "deepseek-reasoner"

# Uncomment for the offline Ollama quick start in examples/README.md:
# [providers.ollama]
# base_url = "http://127.0.0.1:11434/v1"
# api_mode = "openai-chat"
# draft_model = "qwen2.5:14b"
# is_free = true

[defaults]
provider = "deepseek"
