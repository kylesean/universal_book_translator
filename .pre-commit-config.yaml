# Local quality gates: lint/format on every commit, types + fast tests on push.
# Remote CI (`.github/workflows/ci.yml`) repeats these gates on main pushes and
# PRs and additionally runs the slow tier (synthetic PDF render e2e) with a
# checksum-pinned typst — see docs/guides/CI_AND_QUALITY_GATES.md for the plan.
#
#   uv sync --extra dev          # provides pre-commit, ruff, mypy, pytest
#   uv run pre-commit install    # installs both the pre-commit and pre-push hooks
#   uv run pre-commit run --all-files
#
# Hooks use ``language: system`` + ``uv run ...`` so they reuse the project's
# locked toolchain — one version of ruff/mypy whether run by a hook, CI, or by
# hand. A GUI git client that lacks ``uv`` on PATH cannot run the hooks; use a
# terminal for those commits, or ``PRE_COMMIT_ALLOW_NO_CONFIG`` is not a license
# to bypass them (see the doc above).
minimum_pre_commit_version: "3.7.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (--fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Whole-tree checks: pass_filenames off so a push cannot pass just because
      # the changed files happen to be clean. mypy resolves the whole program
      # anyway; the fast tier is ~2.5 minutes, so pre-push is a deliberate
      # gate, not a per-commit cost (lint/format stay on commit).
      - id: mypy
        name: mypy --strict (ubt, tests)
        entry: uv run mypy --strict ubt tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The fast tier is the inner-loop contract: pure-logic units that must
      # stay green before a push (docs/guides/TESTING_STRATEGY.md). Whole-tree
      # (pass_filenames off) so a clean changed-file set cannot hide a break in
      # an untouched test. `-m fast` overrides the `-m 'not slow and not
      # legacy_drift'` in addopts.
      #
      # Coverage floor: a regression guard, not a quality target. The 2026-10
      # audit found ~2,500 lines of dead modules that every gate passed; the
      # floor plus tests/unit/test_no_orphaned_modules.py make that class of
      # rot fail a push. 58% sits ~3pt under the fast-tier baseline so ordinary
      # work never trips it, but a large deletion-without-tests or an orphaned
      # module does.
      - id: pytest-fast
        name: pytest -m fast (with coverage floor)
        entry: uv run pytest -m fast -q --cov=ubt --cov-report=term:skip-covered --cov-fail-under=58
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
