# Pure wire protocol presets shipped with UBT.
# Every LLM provider or gateway speaks one of these four wire protocols.
# Users configure custom endpoints, third-party providers, and credentials
# in ubt.toml (via api_key = "..." or "${VAR}") or via UBT_LLM_API_KEY / CLI flags.

[providers.openai-chat]
base_url = "https://api.openai.com/v1"
api_mode = "openai-chat"
supports_batch_api = true

[providers.openai-responses]
base_url = "https://api.openai.com/v1"
api_mode = "openai-responses"

[providers.anthropic-messages]
base_url = "https://api.anthropic.com"
api_mode = "anthropic-messages"
supports_batch_api = true

[providers.gemini-native]
base_url = "https://generativelanguage.googleapis.com/v1beta"
api_mode = "gemini-native"
