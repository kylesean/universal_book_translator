[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ubt"]

# The operator console is a prebuilt Vite bundle copied into ubt/api/static by
# scripts/build_console_assets.py. It is force-included so a `pip install`ed
# wheel serves the console with no Node.js/pnpm on the end-user machine (PRD
# §7.1.2 / §9). Run the asset build before packaging; a source tree without a
# built frontend has nothing to embed.
[tool.hatch.build.targets.wheel.force-include]
"ubt/api/static" = "ubt/api/static"

# The sdist has no install use beyond source builds, so keep it to what a
# distributor actually needs. Without this it bundled every ``tests/`` entry --
# fixtures plus generated PDFs/EPUBs -- and every PyPI sdist download paid for
# them.
#
# ``docs/`` is intentionally unversioned (gitignored) and changes too often to
# track, so it is excluded from the sdist too. ``README.md`` only says that
# ``docs/`` is unversioned rather than linking into it, so the archive stays
# self-consistent without it. Test-generated
# fixtures are written under ``tests/`` at run time (gitignored, e.g. the
# ``pypdf`` builders in ``tests/pdf_builders.py``) and are covered by the
# ``tests/`` exclude below, so none can reach the archive.
[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "docs/",
    "dist/",
    "output/",
    "scratch/",
    "tmp/",
    "deploy/",
]


[project]
name = "universal-book-translator"
version = "0.1.0"
description = "Pre-1.0 self-hosted book translation engine: single IR, ledger-backed multi-stage LLM pipeline, in-place PDF re-typesetting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    # Replaces the runtime pypdf leg and the poppler pdftoppm subprocess:
    # page raster + text extraction (ubt/adapters/pdf/oxide_render.py).
    # Zero transitive deps, single 26MB abi3 wheel, MIT/Apache dual — the same
    # license profile as pypdfium2. The <0.4 ceiling is deliberate: the 0.3.x
    # bindings drift against their own README (PyPI's `page.text` does not
    # exist in 0.3.78) — re-probe with dir() introspection before any bump.
    "pdf-oxide>=0.3.78,<0.4",
    "pypdfium2>=4.30.0",
    "pyahocorasick>=2.1.0",
    "rapidfuzz>=3.9.0",
    "python-docx>=1.1.0",
    "fonttools>=4.64.0",
    "pillow>=12.3.0",
    "lxml>=6.1.3",
    "pikepdf>=10.13.0.post1",
    "socksio>=1.0.0",
    # Last-resort charset detection for source files with neither a BOM nor a
    # declared encoding (GBK/Shift-JIS Markdown, .txt). See adapters/base.py
    # decode_markup; without it those bytes decode to U+FFFD before any sniffer
    # can look at them.
    "charset-normalizer>=3.3.0",
    "jieba>=0.42.1",
]

[project.scripts]
ubt = "ubt.cli.main:app"
ubt-api = "ubt.api.app:run_server"
ubt-mcp = "ubt.mcp._entrypoint:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    # Anti-hang: pairs with the `--timeout=600` in [tool.pytest.ini_options].
    # Without it a single wedged test can sit until the runner's own wall-clock
    # cap (6h on GitHub Actions). 600s rather than 300s: the deterministic tier
    # is seconds (slowest baseline e2e ≈ 1.4s), but the
    # slow-marked live neural-QE cases inherit addopts whenever addopts is not
    # overridden, and a CometKiwi subprocess has already blown a 300s budget on
    # this project before.
    # Anyone running the live tiers should pass `-o addopts=""`, which clears
    # the timeout along with the marker filter (it replaces addopts wholesale).
    "pytest-timeout>=2.3,<3.0",
    # Coverage floor for the fast tier (see .pre-commit-config.yaml). A
    # regression guard against dead code and untested bulk deletions, not a
    # quality target.
    "pytest-cov>=7.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.8",
    # CI parity: ubt/mcp/server.py imports mcp at module scope, so the `dev`
    # env used by the CI matrix must carry it or `mypy --strict ubt tests`
    # fails with import-not-found on that module. Without this pin
    # `uv sync --extra dev` left mcp absent and the type gate broke.
    # Kept in lockstep with the `mcp` extra below on purpose —
    # optional-dependencies cannot reference another extra.
    "mcp>=2.0.0",
    # Fixture PDFs are written with pypdf (tests/pdf_builders.py) — a
    # deliberately independent, permissive writer so the extraction tests
    # are not also testing the extraction engine under test. Runtime pypdf
    # was retired when pdf_oxide replaced it.
    "pypdf>=4.0.0",
    # Runs the local git hooks in `.pre-commit-config.yaml` (lint/format on
    # commit, types + fast tests on push). This is the gate while remote CI is
    # intentionally disabled during private rapid iteration; the phased rollout
    # and activation triggers live in docs/guides/CI_AND_QUALITY_GATES.md.
    "pre-commit>=4.0.0",
]
# Agent entry point: MCP stdio server (Cursor/Codex call ubt_* tools).
mcp = [
    "mcp>=2.0.0",
]
pdf = [
    "docling>=2.0.0",
]
# Classical detector OCR (CPU-capable, bundled ONNX models).
ocr = [
    "rapidocr>=3.9.0",
    "onnxruntime>=1.29.0",
    # Imported directly by rapidocr_driver.recognize to convert the page image
    # to the BGR ndarray rapidocr's ONNX models expect. rapidocr currently
    # depends on numpy, but the driver imports it by name, so it is declared
    # here rather than relied on transitively.
    "numpy>=1.26.0",
]
# Academic pipeline suite (Docling + Classical detector OCR + ONNX runtime).
academic = [
    "docling>=2.0.0",
    "rapidocr>=3.9.0",
    "onnxruntime>=1.29.0",
    "numpy>=1.26.0",
]
# Second witness: DeepSeek-OCR VLM (proofread grade, ~7 GB weights,
# needs ~9 GB free VRAM — stop ollama residents first).
#
# No `ocr-vlm` extra: its driver (ubt/adapters/pdf/vlm/drivers/deepseek_driver.py)
# imports torch and transformers, and an extra that pulled those would drag ~2 GB
# of CUDA wheels into `uv sync --extra ocr-vlm` for a path most installs never
# take. The previous extra listed addict/easydict/einops/matplotlib, none of
# which is imported anywhere in ubt/ — installing it produced a driver that
# died on first use. Install the stack yourself when you want this path:
#
#     pip install torch transformers huggingface_hub accelerate addict \
#                 easydict einops matplotlib
#
# The driver raises a clear ModuleNotFoundError naming the missing package.
# Reference-free COMET-Kiwi QE. setuptools<81 keeps the
# pkg_resources shim that unbabel-comet 2.2.7's torchmetrics still imports;
# drop the pin when comet moves off torchmetrics 0.x.
qe = [
    "unbabel-comet>=2.2.0",
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort automatic import sorting
    "B",     # flake8-bugbear common traps
    "UP",    # pyupgrade modern Python syntax
    "SIM",   # flake8-simplify code simplification
    "ASYNC", # flake8-async concurrency safety
    "PTH",   # flake8-use-pathlib enforce pathlib
    "C4",    # flake8-comprehensions comprehension optimization
]
ignore = ["E501", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom requires File(...)/Form(...) as
# argument defaults; B008 is a false positive there.
"deploy/docker/ocr-sidecar/server.py" = ["B008"]
# Dynamic monkey-patching of third-party transformers cache without type stubs
"ubt/adapters/pdf/vlm/drivers/deepseek_driver.py" = ["B010"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true

[[tool.mypy.overrides]]
# pypdfium2 ships no py.typed marker.
module = [
    "pypdfium2.*",
    "pypdfium2_raw.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# fontTools ships no py.typed marker (in-place width metrics).
module = "fontTools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lxml ships no inline types / py.typed marker; the DOCX footnote/endnote raw
# blob handling parses via lxml.etree directly.
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional heavy/OCR extras: absent from the default `uv sync --extra dev`
# Environment by design, so the main mypy gate must not require them.
module = [
    "docling.*",
    "docling_core.*",
    "torch.*",
    "transformers.*",
    "huggingface_hub.*",
    "numpy.*",
    "rapidocr.*",
    "rapidocr_onnxruntime.*",
    "onnxruntime.*",
    # The packaged CometKiwi scorer (ubt/core/qe/comet_score_ipc.py) imports
    # `comet` lazily; the neural-QE extra is absent from the dev env.
    "comet.*",
    # scripts/oxide_render_ab.py is imported through a sys.path insert by the
    # gated A/B test; mypy has no MYPYPATH entry for scripts/.
    "oxide_render_ab",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The OCR-VLM driver needs a narrow `type: ignore[no-untyped-call]` when
# transformers IS installed (torch/transformers are installed manually for the
# OCR-VLM path, not via an extra), but with transformers absent the
# `ignore_missing_imports` override above makes AutoTokenizer `Any`, the
# call becomes well-typed, and `warn_unused_ignores` turns that same ignore into
# a hard error. The dev-only CI env therefore failed on the very ignore that
# keeps a full local env clean, so unused-ignore reporting is disabled for this
# one module instead of dropping the ignore (which would break local runs).
module = [
    "ubt.adapters.pdf.vlm.drivers.deepseek_driver",
    "ubt.adapters.pdf.vlm.drivers.deepseek_worker",
]
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Default loop runs the fast subset; heavy integration/baselines opt in via
# `pytest -o addopts=""` (everything) or `-m slow` (slow only). Remote CI
# (.github/workflows/ci.yml) runs the fast tier everywhere and the slow tier
# with a checksum-pinned typst; the local git hooks stay the inner-loop gate
# (see docs/guides/CI_AND_QUALITY_GATES.md).
#
# `--timeout=600` (pytest-timeout, dev extra) caps any single test: a hang fails
# in 10 minutes instead of sitting until the runner's wall-clock cap. It rides
# in addopts, so `-o addopts=""` also clears it — that is deliberate, and is how
# the multi-minute live tiers (local MT + CometKiwi) are meant to be run.
addopts = "-m 'not slow and not legacy_drift' --timeout=600"
markers = [
    "network: marks tests that require network access (e.g. Docling HuggingFace model downloads)",
    "slow: marks tests that spawn heavy subprocesses (typst compiles, pandoc, pdftoppm) or the oxide/pdftoppm render A/B comparison; deselect with -m 'not slow'",
    "fast: pure-logic unit tests cheap enough for the per-edit inner loop; `pytest -m fast` runs the whole tier in ~2 s",
    # AGENTS.md §2: a legacy check that blocks work and costs more than 15 min of
    # archaeology moves here instead of being deleted or left red. Quarantine is not
    # amnesty — the full local suite (and the stage-1 CI job once activated,
    # docs/guides/CI_AND_QUALITY_GATES.md) runs it via `-o addopts=""`, and every
    # use must name what it is waiting on in the marker's reason argument.
    "legacy_drift: quarantined legacy check, deselected from the inner loop but still run in full runs",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:docling.*",
    # Third-party internals only. Narrowed from a blanket ``starlette.*`` /
    # ``anyio.*`` ignore: the 2026-10 audit found six of *our own* uses of the
    # deprecated ``status.HTTP_422_UNPROCESSABLE_ENTITY`` hidden by the blanket
    # filter. These two modules are the only remaining sources, and both are
    # inside the third-party test client / async runtime we do not control.
    "ignore::DeprecationWarning:starlette.testclient.*",
    "ignore::DeprecationWarning:anyio._lazyimport.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # jieba 0.42.1 imports ``pkg_resources`` at module load; the warning is in
    # its vendored ``_compat``, not our code. Narrow to that module so a
    # deprecation anywhere in our own tokenizer usage still surfaces.
    "ignore:pkg_resources is deprecated as an API:UserWarning:jieba.*",
]
