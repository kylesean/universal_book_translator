name: Nightly Provider Smoke

# Root cause for the benchmark report's "measured" numbers
# are driven by MockProvider, and environment-gated real-model tests never
# run in CI. This workflow spends a small real-API budget nightly to exercise
# the live provider path end to end — one real draft call, asserting
# invariants that must hold for any competent provider (non-empty output, no
# leaked placeholder or prompt scaffold, numeric fidelity, observable token
# usage). It does NOT yet assert translation-quality thresholds: those need a
# calibrated golden set, still open (review D1). Without the secret the
# `smoke` job self-skips.
#
# `live-local` exercises the zero-API-cost real-model path:
# local Ollama MT + CometKiwi QE. Every install step is best-effort — the
# integration tests self-skip when a service is absent, and a summary step
# warns when everything skipped so the job cannot silently become a no-op.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {} # manual trigger for on-demand smoke runs

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # GitHub's default job cap is 6h; this job's own step caps sum to less
    # than 3h, so a wedged step cannot quietly own the runner all night.
    timeout-minutes: 180
    if: github.event_name == 'workflow_dispatch' || github.repository == github.event.repository.full_name
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        timeout-minutes: 5
        run: uv python install 3.12

      - name: Install dependencies (dev + pdf extras)
        timeout-minutes: 20
        run: uv sync --extra dev --extra pdf --locked

      - name: Real-provider smoke (small budget)
        # One real draft call; 45 min is generous for a rate-limited API and
        # still fails long before the job cap would.
        timeout-minutes: 45
        env:
          UBT_SMOKE_API_KEY: ${{ secrets.UBT_SMOKE_API_KEY }}
        run: |
          if [ -z "$UBT_SMOKE_API_KEY" ]; then
            echo "::notice::UBT_SMOKE_API_KEY not configured - smoke run skipped"
            exit 0
          fi
          # The test reads the canonical outbound credential name, not the
          # secret name; without this mapping the budget was never spent.
          export UBT_LLM_API_KEY="$UBT_SMOKE_API_KEY"
          set -o pipefail
          # Name the file explicitly. The previous `-k "smoke or real"` selector
          # matched only test_docling_real_paper.py (on the module name
          # containing "real"): a file with zero provider references whose
          # fixtures were never fetched, so it always skipped and no real
          # provider call was ever made by this job.
          # `-v` is required for the guard below: `-q` prints dots and never the
          # token PASSED, so `grep -c PASSED` was 0 even on success — the step
          # failed whenever the secret WAS configured.
          uv run pytest tests/integration/test_live_provider_smoke.py -o addopts="" -v -rs 2>&1 | tee /tmp/smoke.log
          passed=$(grep -cE '^tests/.*PASSED' /tmp/smoke.log || true)
          if [ "$passed" -eq 0 ]; then
            echo "::error::real-provider smoke did not run: no PASSED case in the log (check UBT_SMOKE_API_KEY and the skip reason printed above)"
            exit 1
          fi
          echo "::notice::real-provider smoke verified ${passed} live case(s)"

      # Formula engine matrix on the generated synthetic corpus with a
      # mock provider (zero API budget). Installs are best-effort; the test
      # self-skips when docling or Node/MathJax is unavailable.
      - name: Set up Node (MathJax engine)
        timeout-minutes: 5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Install MathJax engine deps (best effort)
        timeout-minutes: 10
        run: |
          cd scripts/mathjax && npm ci \
            || echo "::warning::npm ci failed - formula engine matrix will self-skip"

      - name: Formula engine matrix (synthetic corpus, mock provider)
        timeout-minutes: 120
        run: |
          set -o pipefail
          # -v, not -q: the guards below grep for PASSED, which -q never prints
          # (the exact trap the real-provider smoke step documents above).
          uv run pytest tests/integration/test_formula_engine_matrix.py -o addopts="" -v -rs 2>&1 | tee /tmp/formula.log
          if grep -qE "corpus missing|points at a missing file" /tmp/formula.log; then
            # The generated synthetic corpus is what makes this the project's
            # only end-to-end formula coverage on a clone; if it is gone, or a
            # UBT_TEST_REAL_PDF override points at nothing, the step is green
            # while testing nothing - which is exactly how the copyright sweep
            # left the old chapter-3 paths silently dead.
            echo "::error::formula engine matrix has no corpus - regenerate tests/fixtures/synthetic-*.pdf with scripts/make_sample_corpus.py or unset UBT_TEST_REAL_PDF"
            exit 1
          fi
          passed=$(grep -cE '^tests/.*PASSED' /tmp/formula.log || true)
          if [ "$passed" -eq 0 ]; then
            echo "::warning::formula engine matrix ran zero cases (docling or Node/MathJax unavailable on this runner)"
          else
            echo "::notice::formula engine matrix verified ${passed} case(s)"
          fi

      # The main CI job runs every marker (`-o addopts=""`), so @network is not
      # excluded there; this job is where the real Docling path (HF weight
      # downloads) runs deliberately. Best-effort: an HF-side flake warns
      # instead of reddening the whole nightly.
      - name: Docling real-model tests (network)
        timeout-minutes: 30
        continue-on-error: true
        run: |
          uv run pytest tests/unit/test_pdf_modern_adapters.py -o addopts="-m network" -q -rs 2>&1 | tee /tmp/network.log
          if grep -qE '^[0-9]+ (passed|failed)' /tmp/network.log && ! grep -qE ' [1-9][0-9]* failed' /tmp/network.log; then
            echo "::notice::@network docling tests green"
          else
            echo "::warning::@network docling tests did not pass clean (HF flake or real breakage - inspect this job's log)"
          fi

  live-local:
    # Zero-API-cost real-model validation (Ollama MT + CometKiwi QE).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.repository == github.event.repository.full_name
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        timeout-minutes: 5
        run: uv python install 3.12

      # unbabel-comet pulls torch (~2 GB) — nightly-only by design (qe extra).
      - name: Install dependencies (dev + qe extras)
        timeout-minutes: 20
        run: uv sync --extra dev --extra qe --locked

      - name: Install and start Ollama (best effort)
        # `ollama pull translategemma:4b` is a ~2.5 GB fetch with no progress
        # gate of its own; 30 min bounds it without racing the 60-min job cap.
        timeout-minutes: 30
        run: |
          curl -fsSL https://ollama.com/install.sh | sh || echo "::warning::ollama install failed"
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags && break
            sleep 1
          done
          ollama pull translategemma:4b || echo "::warning::translategemma:4b pull failed - MT tests will self-skip"

      # The Unbabel upstream is gated (needs HF_TOKEN); the ben-xl8 mirror is
      # not, and both the packaged comet scorer (ubt/core/qe/comet_score_ipc.py)
      # and _live_helpers already
      # prefer it. Zero-token download keeps the nightly honest: QE
      # calibration runs even when no HF secret is configured. (For runs on
      # CN networks add HF_ENDPOINT=https://hf-mirror.com locally; GitHub
      # runners should use the default endpoint.)
      - name: Fetch CometKiwi checkpoint (ben-xl8 mirror, zero-token)
        timeout-minutes: 20
        run: |
          uv run hf download ben-xl8/wmt22-cometkiwi-da \
            || echo "::warning::CometKiwi mirror download failed - QE tests will self-skip"

      - name: Run live local tests (self-skip when services absent)
        # Live neural tiers can legitimately run for many minutes (model
        # warm-up + CometKiwi inference), hence 30 rather than the merge
        # gate's tighter caps; the job-level 60 min still backstops it.
        timeout-minutes: 30
        run: |
          set -o pipefail
          # The live helpers probe :9090 (llama-swap) by default; this job starts
          # Ollama on :11434, so point them at it or every MT/QE test self-skips
          # and the job collects zero real-model signal.
          export UBT_LIVE_MT_BASE_URL=http://localhost:11434
          # test_local_model_baseline.py is the zero-cost REAL-MODEL baseline
          # (review D1): a fixed EN→ZH corpus through the local MT model with hard
          # structural invariants. It is a hard gate — unlike the rest of this job,
          # its failures are real regressions, not missing weights. It already
          # caught one defect the inspection review missed (the '1980s' ->
          # '20世纪80年代' false positive), which is the point of having it.
          uv run pytest tests/integration/test_local_model_baseline.py \
                        tests/integration/test_mt_tier_live.py \
                        tests/integration/test_qe_calibration.py \
                        -o addopts="" -v -rs 2>&1 | tee /tmp/live-local.log

      - name: Warn when everything skipped (no-op guard)
        if: always()
        timeout-minutes: 5
        run: |
          skipped=$(grep -c "SKIPPED" /tmp/live-local.log || true)
          passed=$(grep -c "PASSED" /tmp/live-local.log || true)
          echo "passed=$passed skipped=$skipped"
          if [ "$passed" -eq 0 ] && [ "$skipped" -gt 0 ]; then
            echo "::warning::live-local ran but every test skipped - Ollama model or CometKiwi checkpoint missing, no real-model signal collected"
          fi
