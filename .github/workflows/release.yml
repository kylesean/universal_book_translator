name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0). Must be an existing tag."
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Sanity Gate & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # ``workflow_dispatch`` runs on a branch ref, so the release tag has to
          # be checked out explicitly. Without this the declared ``tag`` input was
          # a dead parameter: the run built the branch and the release step had no
          # tag to attach to.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if [ -z "$tag" ]; then
            echo "::error::no release tag resolved (inputs.tag and github.ref_name are both empty)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Install Python + dev dependencies
        run: |
          uv python install 3.12
          uv sync --extra dev --locked

      - name: Verify the tag matches the packaged version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          uv run python - <<'PY'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              packaged = tomllib.load(fh)["project"]["version"]
          tagged = os.environ["VERSION"]
          if tagged != packaged:
              sys.exit(
                  f"release tag version {tagged!r} does not match pyproject version "
                  f"{packaged!r}: bump the version (or retag) before publishing."
              )
          print(f"version {packaged} matches the tag")
          PY

      - name: Lint & Format Check
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Type Check
        run: uv run mypy --strict ubt tests

      - name: Layering Invariant
        run: uv run python scripts/dump_compiler_edges.py

      - name: Console Bundle Present
        run: uv run python scripts/check_console_bundle.py

      - name: Install typst and CJK fonts
        env:
          TYPST_VERSION: "0.15.1"
          TYPST_SHA256: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          archive="typst-x86_64-unknown-linux-musl.tar.xz"
          # --retry covers transient HTTP 5xx from the release CDN (observed
          # 504s took down CI runs while the status page stayed green);
          # the archive is checksum-pinned below, so a bad fetch cannot land.
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 5 --retry-delay 15 \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${TYPST_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install "/tmp/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst

      - name: Fast Test Tier
        env:
          PYTHONIOENCODING: "utf-8"
        run: >
          uv run pytest -m fast -q -n auto --dist=loadscope
          --cov=ubt --cov-report=term:skip-covered --cov-fail-under=70

  build-dist:
    name: Build & Verify Wheel/Sdist
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm + Node
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 12

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Install Python
        run: |
          uv python install 3.12
          uv sync --extra dev --locked

      - name: Build Web Console Bundle
        run: |
          pnpm --dir web install --frozen-lockfile
          uv run python scripts/build_console_assets.py

      - name: Install typst and CJK fonts
        env:
          TYPST_VERSION: "0.15.1"
          TYPST_SHA256: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          archive="typst-x86_64-unknown-linux-musl.tar.xz"
          # --retry covers transient HTTP 5xx from the release CDN (observed
          # 504s took down CI runs while the status page stayed green);
          # the archive is checksum-pinned below, so a bad fetch cannot land.
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 5 --retry-delay 15 \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${TYPST_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install "/tmp/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst

      - name: Build Python Distribution (sdist & wheel)
        run: uv build --out-dir dist

      - name: Smoke-Test Installed Wheel & Sample Book Pipeline
        run: |
          # Create clean venv and install built wheel
          uv venv /tmp/test-venv
          source /tmp/test-venv/bin/activate
          uv pip install dist/*.whl

          # Verify entrypoints
          ubt --help
          ubt doctor

          # Run end-to-end sample book verification
          python scripts/verify_sample_book.py --strict

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2b6fb7fb9151  # v4.4.3
        with:
          name: dist-packages
          path: dist/*
          if-no-files-found: error

  build-docker:
    name: Build & Push Multi-Arch Docker Container
    # Waits for the wheel smoke test. It used to push in parallel with
    # ``build-dist``, so a failed distribution left an un-retractable image tag on
    # GHCR — a "published image, no release" half-state.
    needs: [gate, build-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-architecture emulation)
        uses: docker/setup-qemu-action@49b3bc8e6bdd4480b82f6f5b219a11cac4b779f9  # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@369eb591f429131d7003c0783f4a1ea928ac0ca1  # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.tag.outputs.version }}
            # ``is_default_branch`` is false on a tag ref, so ``:latest`` was
            # never updated by an actual release. Every release tag is the
            # newest stable image, so tag it here.
            type=raw,value=latest

      - name: Build and Push Multi-Arch Image (amd64, arm64)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75  # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-dist, build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download Distribution Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: dist-packages
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2.0.8
        with:
          # Required on workflow_dispatch, where github.ref is a branch: the
          # action refuses to guess a tag.
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
