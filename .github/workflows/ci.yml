# The gate CI repeats is the local one (`.pre-commit-config.yaml`): lint and
# format on every commit, types + the fast test tier on push. CI must repeat a
# gate that already passes, never be the first place it runs.
#
# Keep this job Linux-only / single-Python on purpose. The Windows matrix,
# macOS portability, `pdf` extra, and nightly real-model jobs are stage 2-3 --
# add each only when it can stay green. The slow tier runs here too, on the
# synthetic PDF render e2e, with a checksum-pinned typst; the real-document
# corpus harnesses in that tier skip without the gitignored documents.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only reads the checkout.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Backstop only — the deterministic dev tier is seconds. Well under
    # GitHub's 6h default so a wedged job fails readably instead of quietly
    # owning the runner.
    timeout-minutes: 20
    steps:
      # Actions pinned to commit SHAs (mutable tags are a supply-chain risk).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Install Python + locked dev dependencies
        # `--locked` keeps the job reproducible against the committed uv.lock;
        # without it uv may re-resolve and drift from what the local gate ran.
        run: |
          uv python install 3.12
          uv sync --extra dev --locked

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Types (mypy --strict)
        run: uv run mypy --strict ubt tests

      - name: Layering invariant (core→compiler edges)
        # Mirrors the pre-push hook of the same name: a module-level ubt.core
        # import of a compiler package is a forbidden reverse edge. The tool
        # existed but no gate ran it, so a regression landed under an all-green
        # push; the acceptance tool exits non-zero on any violation.
        run: uv run python scripts/dump_compiler_edges.py

      # The fast tier's render-contract tests (math transpiler, render-mode
      # routing) shell out to the external typst compiler. Installed BEFORE the
      # fast tier: run after it, those tests silently skipped in CI (8 cases)
      # while passing locally — the green did not cover what it claimed.
      # Pin the release version and verify its official SHA-256 rather than
      # trusting a mutable "latest"/tag download.
      - name: Install typst (checksum-pinned) and CJK fonts
        env:
          TYPST_VERSION: "0.15.1"
          TYPST_SHA256: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          archive="typst-x86_64-unknown-linux-musl.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${TYPST_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install "/tmp/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version

      - name: Fast test tier (pytest)
        # UTF-8 I/O: the product writes CJK to stdout and Windows consoles are
        # cp1252, so pin the encoding even on this Linux job's local runs.
        # The coverage floor is a regression guard (see .pre-commit-config.yaml):
        # it catches a large deletion-without-tests or an orphaned module, the
        # class of rot that lint/types/tests alone let through. xdist splits
        # the tier across cores (measured 30s -> 10s; coverage unchanged).
        env:
          PYTHONIOENCODING: "utf-8"
        run: >
          uv run pytest -m fast -q -n auto --dist=loadscope
          --cov=ubt --cov-report=term:skip-covered --cov-fail-under=70

      # The wheel force-includes the *prebuilt* SPA bundle at ubt/api/static
      # (pyproject.toml), so a `pip install`ed release serves whatever was
      # committed. Nothing else rebuilds it: without this step a web/src change
      # ships a stale bundle (the console contract tests skip when assets are
      # absent, and no Python test compares the bundle to its source). Rebuild
      # and fail if the committed bundle is not what the current source produces.
      - name: Install pnpm + Node
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Web console bundle is up to date
        # `pnpm build` runs `tsc -b` then `vite build`, so this also type-checks
        # the frontend. The build is deterministic (content-hashed assets), so a
        # clean `git diff` proves the committed bundle matches the source.
        run: |
          pnpm --dir web install --frozen-lockfile
          # `uv run`, like every other Python step here: a bare `python` is the
          # runner's system interpreter, which has none of this project's
          # dependencies. That is not hypothetical -- the script imports
          # `ubt.cli.jstoolchain`, and the eager `from ubt.cli.main import app`
          # it used to trigger made this step die on `ModuleNotFoundError:
          # typer` before it ever compared a bundle.
          uv run python scripts/build_console_assets.py
          if ! git diff --exit-code --quiet ubt/api/static; then
            echo "::error::ubt/api/static is stale — run 'pnpm --dir web build && python scripts/build_console_assets.py' and commit the result."
            git diff --stat ubt/api/static
            exit 1
          fi

      - name: Slow test tier (synthetic PDF render e2e)
        env:
          PYTHONIOENCODING: "utf-8"
        run: uv run pytest -m slow -q

  # The `gate` job installs `--extra dev`, which does NOT include the `pdf`
  # extra (docling). Every PDF-path test there therefore ran on the pdfium
  # engine only, and the default engine -- `auto`, which routes to docling
  # unconditionally -- was never exercised by CI at all. The crash/resume e2e
  # was red on the docling path while this pipeline stayed green.
  #
  # Separate job: docling pulls torch and a model download, which would double
  # the fast tier's install for no benefit to it.
  docling-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Install Python + dev AND pdf extras
        run: |
          uv python install 3.12
          uv sync --extra dev --extra pdf --locked

      - name: Report the resolved engine
        # A silent skip back to pdfium would make this job pass without testing
        # anything, which is the exact failure mode it exists to prevent.
        run: |
          uv run python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("docling") is not None, (
              "docling is not installed — the pdf extra did not resolve"
          )
          from ubt.adapters.pdf.engine_selector import inspect_pdf_route_plan
          print("docling available; auto ->", inspect_pdf_route_plan.__name__)
          PY

      - name: Default-engine PDF tier (docling)
        # The suite that previously could not run under the default engine.
        env:
          PYTHONIOENCODING: "utf-8"
        run: >
          uv run pytest -m fast -q -n auto --dist=loadscope
          tests/unit/adapters/ tests/integration/
