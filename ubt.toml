# Universal Book Translator (UBT) - Project Configuration
# Protocol-First Provider Profiles
#
# NOTE: there is no `provider_name` key. UBTConfig has no such field and profiles
# are parsed with extra="ignore", so a `provider_name = "..."` line is silently
# dropped — the wire protocol comes from `base_url` + `api_mode`, the models from
# `draft_model` / `repair_model`. Every such line was removed on 2026-09-24 so the
# file stops implying it selects a backend.

[profiles.default]
base_url = "https://opencode.ai/zen/go/v1"
draft_model = "muse-spark-1.3-contributor"
repair_model = "muse-spark-1.3-contributor"
api_mode = "responses"
draft_reasoning_effort = "low"
repair_reasoning_effort = "high"

[profiles.opencode-go]
base_url = "https://opencode.ai/zen/go/v1"
draft_model = "muse-spark-1.3-contributor"
repair_model = "muse-spark-1.3-contributor"
api_mode = "responses"
draft_reasoning_effort = "low"
repair_reasoning_effort = "high"

[profiles.muse-spark]
base_url = "https://opencode.ai/zen/go/v1"
draft_model = "muse-spark-1.3-contributor"
repair_model = "muse-spark-1.3-contributor"
api_mode = "responses"
draft_reasoning_effort = "low"
repair_reasoning_effort = "high"

# ---- Local self-hosted stack: llama-swap gateway + llama.cpp backends --------
# Everything local answers on ONE endpoint: llama-swap at 127.0.0.1:9090. It
# loads a backend on demand and hands it an ephemeral port (10001+), so a
# profile must never name a backend port. The standalone 8081/8082/8083 servers
# and the Ollama daemon on :11434 (retired 2026-09-23, unit disabled, weights
# deleted) are all dead endpoints — see ~/data/llm/README.md.
#
# Model names must match the keys under `models:` in llama-swap's config.yaml:
#   gemma4-e4b        出版级翻译流水线（术语强制 / 结构化输出 / 工具调用）
#   translategemma:4b 专用 MT（浏览器插件、字幕这类"简单提示词直出"）
#   bonsai2-27b       编码 agent（code 组，与 translate 组互斥）

[profiles.local-gemma4]
base_url = "http://127.0.0.1:9090/v1"
api_mode = "chat"
draft_model = "gemma4-e4b"
repair_model = "gemma4-e4b"
# The backend runs `--reasoning off`: Gemma-4 thinking costs 10x on the same
# sentence (37 -> 405 tokens). Send the matching flag so no client-side default
# can silently turn it back on.
chat_template_kwargs = { enable_thinking = false }

[profiles.local-tg]
base_url = "http://127.0.0.1:9090/v1"
api_mode = "chat"
draft_model = "translategemma:4b"
repair_model = "translategemma:4b"

[profiles.local-code]
base_url = "http://127.0.0.1:9090/v1"
api_mode = "chat"
draft_model = "bonsai2-27b"
repair_model = "bonsai2-27b"

# Rollback only — Ollama is retired (unit disabled, ~/.ollama holds no weights):
#   systemctl --user enable --now ollama && ollama pull <model>
# then uncomment and name the model you pulled.
