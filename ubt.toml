# UBT provider 注册表。密钥不写这里（写了会被拒绝），只写承载密钥的环境变量名 api_key_env。
# 选中：UBT_PROVIDER=<name> 或 --provider <name>
# 优先级：CLI > UBT_* 环境变量 > [providers.<name>] > [defaults] > 字段默认值
# 内置（无需声明）：openai / anthropic / gemini / deepseek / opencode
# 本机：export UBT_PROVIDER=opencode && export UBT_LLM_API_KEY=...

# 本地 llama-swap 网关（127.0.0.1:9090），模型名须与 config.yaml 的 models: 键一致。
# provider 不写后端端口：后端按需加载并分配临时端口。

# OpenCode Zen /go/ 拒收无 x-opencode-session 的请求；用通用 extra_headers 表达。
[providers.opencode]
extra_headers = { "x-opencode-session" = "${OPENCODE_SESSION_ID}" }

[providers.local-gemma4]
base_url = "http://127.0.0.1:9090/v1"
api_mode = "openai-chat"
draft_model = "gemma4-e4b"
repair_model = "gemma4-e4b"
# 后端以 --reasoning off 运行，显式带上同样开关避免客户端默认打开。
chat_template_kwargs = { enable_thinking = false }

[providers.local-tg]
base_url = "http://127.0.0.1:9090/v1"
api_mode = "openai-chat"
draft_model = "translategemma:4b"
repair_model = "translategemma:4b"

[providers.local-code]
base_url = "http://127.0.0.1:9090/v1"
api_mode = "openai-chat"
draft_model = "bonsai2-27b"
repair_model = "bonsai2-27b"
